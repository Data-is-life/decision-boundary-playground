name: App smoke checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Check XGBoost is available
        run: python -c "from xgboost import XGBClassifier"
      - name: Run binary and multiclass smoke checks
        run: python -m unittest discover -s tests -v
